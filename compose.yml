name: "netbird"

x-lockdown: &lockdown
  # prevents any process within the container to gain more privileges
  security_opt:
    - "no-new-privileges=true"
  # needed for full netbird client to manipulate routing and DNS
  cap_add:
    - NET_ADMIN
    - SYS_ADMIN
    - SYS_RESOURCE

services:
  client:
    image: "11notes/netbird-client:0.77.1"
    <<: *lockdown
    environment:
      TZ: "Europe/Zurich"
      NETBIRD_PEER_NAME: "${NETBIRD_PEER_NAME}"
      NETBIRD_URL: "${NETBIRD_URL}"
      NETBIRD_SETUP_KEY: "${NETBIRD_SETUP_KEY}"
    devices:
      - "/dev/net/tun"
    volumes:
      - "netbird-client.etc:/netbird/etc"
    tmpfs:
      - "/run:uid=1000,gid=1000"
    network_mode: "host"
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv6.conf.all.forwarding: "1"
    restart: "always"

volumes:
  netbird-client.etc: